name: Public Site Health
on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1"
permissions:
  contents: read
jobs:
  public-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check live article metadata, sitemap, 404s, and email link
        run: node scripts/audit-public-site.mjs

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Check production dependency advisories
        run: pnpm audit --prod --audit-level high
